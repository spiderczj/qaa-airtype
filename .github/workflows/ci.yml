name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 测试
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: 校验运行环境
        run: python -c "import tkinter, flask, pyautogui, PIL, qrcode, pystray"

      - name: 跑测试
        run: python -m unittest discover -s tests -v

  release:
    name: 打包并发布到 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: 打包 .app 与 DMG
        run: ./build.sh

      - name: 上传 DMG 到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "QAA AirType ${tag}" --generate-notes
          gh release upload "$tag" "dist/QAA-AirType.dmg" --clobber
